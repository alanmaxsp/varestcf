name: R-CMD-check

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} (R ${{ matrix.r }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        r: [release]
    env:
      R_KEEP_PKG_SOURCE: 'yes'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - name: Check public files
        run: Rscript .github/scripts/check-public-files.R

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          extra-packages: |
            any::rcmdcheck
            any::Matrix

      - uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          args: 'c("--no-manual")'
          error-on: '"warning"'
          check-dir: '"check"'
          upload-results: always

      - name: Show consolidated acceptance result
        if: always()
        shell: Rscript {0}
        run: |
          files <- list.files("check", pattern = "^acceptance\\.Rout(\\.fail)?$",
                              recursive = TRUE, full.names = TRUE)
          for (file in files) {
            lines <- readLines(file, warn = FALSE)
            cat(file, "\n")
            cat(tail(lines, 8L), sep = "\n")
          }
